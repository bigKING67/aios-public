# Opt-in independent workers. Do not enable before ledger migrations and runtime acceptance.
x-worker: &worker
  image: ${AIOS_CONTENT_PRODUCTION_IMAGE:-aios-content-production:local}
  build:
    context: .
    dockerfile: docker/content-production/Dockerfile
  profiles: [content-production]
  restart: unless-stopped
  init: true
  user: "10001:10001"
  read_only: true
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  pids_limit: 256
  mem_limit: 2g
  cpus: 1.5
  shm_size: 256m
  tmpfs:
    - /tmp:rw,nosuid,nodev,size=256m,mode=1777
    - /work:rw,nosuid,nodev,size=2g,uid=10001,gid=10001,mode=0700
  env_file:
    - ${CONTENT_PRODUCTION_ENV_FILE:?set dedicated private worker env file}
  environment:
    CONTENT_PRODUCTION_ENABLED: ${CONTENT_PRODUCTION_ENABLED:-false}
    CONTENT_PRODUCTION_SHOT_EXTRACTION_ENABLED: ${CONTENT_PRODUCTION_SHOT_EXTRACTION_ENABLED:-false}
    CONTENT_PRODUCTION_SEMANTICS_ENABLED: ${CONTENT_PRODUCTION_SEMANTICS_ENABLED:-false}
  stop_grace_period: 45s

services:
  aios-content-render:
    <<: *worker
    command: [python, -m, content_production.worker]
  aios-content-extract:
    <<: *worker
    command: [python, -m, content_production.shot_worker]
  aios-content-semantics:
    <<: *worker
    profiles: [content-production-semantics]
    command: [python, -m, content_production.semantic_worker]
