[project]
name = "groland-postgres"
version = "0.1.0"
description = "PostgreSQL assets and Prefect-based orchestration for groland"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
  "jieba==0.42.1",
  "prefect==3.8.8",
  # Prefect scheduler bulk inserts fail with SQLAlchemy2.1 hybrid DML semantics.
  "sqlalchemy>=2.0,<2.1",
  "psycopg2-binary>=2.9.9,<3.0",
  "python-dotenv>=1.0.0,<2.0",
  "pyyaml>=6.0,<7.0",
  "requests>=2.31.0,<3.0",
  "schedule>=1.2.0,<2.0",
  "opencv-python-headless==4.14.0.94",
]

[project.optional-dependencies]
# Framework split v2 on the GPU node (content_production/framework_v2). OCR runs on CUDA through
# torch; the Linux torch wheels bundle the CUDA runtime, the node only needs the NVIDIA driver.
framework-v2 = [
  "scenedetect==0.7.2",
  "rapidocr==3.10.0",
  "torch==2.14.1",
]
framework-harness = [
    "gepa==0.1.4",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "pip-audit>=2.9,<3",
    "pytest>=9.1.1,<10",
]
