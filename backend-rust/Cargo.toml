[package]
name = "aios-backend-rust"
version = "0.1.0"
edition = "2021"
default-run = "aios-backend-rust"

[dependencies]
anyhow = "1.0.104"
axum = { version = "0.8.9", features = ["macros", "json", "multipart"] }
axum-extra = { version = "0.12.6", features = ["typed-header"] }
bcrypt = "0.19.3"
calamine = "0.36.1"
chrono = { version = "0.4.45", features = ["serde"] }
hex = "0.4.3"
hmac = "0.13.0"
http = "1.5.0"
jsonwebtoken = { version = "11.1.0", default-features = false, features = ["aws_lc_rs"] }
once_cell = "1.21.4"
dragonfly_client = { package = "redis", version = "1.7.1", features = ["tokio-comp"] }
regex = "1.13.1"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "query", "form", "rustls"] }
rust_xlsxwriter = "0.99.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "tls-rustls-ring", "postgres", "chrono", "json", "uuid"] }
thiserror = "2.0.21"
tokio = { version = "1.53.2", features = ["full"] }
tower-http = { version = "0.7.1", features = ["cors", "trace"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }
uuid = { version = "1.27.0", features = ["v4", "serde"] }

[dev-dependencies]
base64 = "0.23.1"

[profile.dev]
debug = "line-tables-only"

[profile.release]
lto = true
codegen-units = 1
opt-level = 3
