[package]
name = "aios-backend-rust"
version = "0.1.0"
edition = "2021"
default-run = "aios-backend-rust"

[dependencies]
anyhow = "1.0"
axum = { version = "0.8", features = ["macros", "json", "multipart"] }
axum-extra = { version = "0.10", features = ["typed-header"] }
bcrypt = "0.17"
calamine = "0.36"
chrono = { version = "0.4", features = ["serde"] }
hex = "0.4"
hmac = "0.12"
http = "1.1"
jsonwebtoken = { version = "10.1", default-features = false, features = ["aws_lc_rs"] }
once_cell = "1.21"
dragonfly_client = { package = "redis", version = "0.32", features = ["tokio-comp"] }
regex = "1.11"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rust_xlsxwriter = "0.95"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio-rustls", "postgres", "chrono", "json", "uuid"] }
thiserror = "2.0"
tokio = { version = "1.48", features = ["full"] }
tower-http = { version = "0.6", features = ["cors", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
uuid = { version = "1.18", features = ["v4", "serde"] }

[profile.dev]
debug = "line-tables-only"

[profile.release]
lto = true
codegen-units = 1
opt-level = 3
